name: Backend tests

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: resume_user
          POSTGRES_PASSWORD: resume_pass
          POSTGRES_DB: resume_screener
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U resume_user -d resume_screener
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://resume_user:resume_pass@localhost:5432/resume_screener
      SECRET_KEY: ci-test-secret-key
      MIGRATION_TEST_DB_URL: postgresql+psycopg://resume_user:resume_pass@localhost:5432/resume_screener
      DISABLE_RATE_LIMITING: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Install psycopg (sync driver for migration tests)
        run: pip install "psycopg[binary]>=3.1,<4"

      - name: Run unit and migration tests
        run: pytest tests/test_new_features.py tests/test_pdf_parser.py tests/test_migration.py tests/test_inference.py tests/test_security.py -v
        env:
          DATABASE_URL: postgresql+asyncpg://resume_user:resume_pass@localhost:5432/resume_screener
          SECRET_KEY: ci-test-secret-key
          MIGRATION_TEST_DB_URL: postgresql+psycopg://resume_user:resume_pass@localhost:5432/resume_screener
          DISABLE_RATE_LIMITING: "true"
